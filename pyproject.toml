[project]
name = "data-analytics-se-notebooks"
version = "0.1.0"
description = "Reproducible execution environment for the ME 539 lecture book"
requires-python = ">=3.11,<3.12"
dependencies = [
    "filterpy",
    "fipy",
    "ghp-import",
    "gpytorch",
    "graphviz",
    "ipykernel",
    "jax",
    "jupyter-book==0.15.1",
    "matplotlib>=3.9",
    "matplotlib-inline",
    "nbclient",
    "nbformat",
    "numpy",
    "numpyro",
    "openpyxl",
    "pandas",
    "pillow",
    "pyro-ppl",
    "scikit-learn>=1.2",
    "scipy",
    "seaborn",
    "statsmodels",
    "torch",
    "torchvision",
    "tqdm",
]

[tool.uv]
package = false
